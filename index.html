<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum ACD · Projects</title>
<meta name="description" content="Хаб проектов Quantum ACD: приложения, лицензии, презентации и эксперименты.">
<meta property="og:title" content="Quantum ACD · Projects">
<meta property="og:description" content="Хаб проектов Quantum ACD.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0f1e;
    --card: rgba(18, 30, 55, 0.72);
    --border: rgba(255, 255, 255, 0.07);
    --text: #eef2ff;
    --muted: #8ea4c8;
    --accent: #7aa5ff;
    --accent2: #c5b4ff;
    --radius: 18px;
    --shadow: 0 22px 45px -25px rgba(0,0,0,0.8);
  }

  html[data-theme="light"] {
    --bg: #f4f6fb;
    --card: rgba(255, 255, 255, 0.85);
    --border: rgba(10, 20, 40, 0.08);
    --text: #0f1a2e;
    --muted: #5b6b85;
    --shadow: 0 22px 45px -30px rgba(10,20,40,0.25);
  }

  html, body { min-height: 100%; }

  body {
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: clamp(1.2rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem);
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
    position: relative;
  }

  /* ─── Живой фон ───────────────────────────────────────────── */
  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(40px);
    opacity: 0.55;
    will-change: transform;
  }
  .orb.a {
    width: 46vmax; height: 46vmax;
    top: -18vmax; left: -12vmax;
    background: radial-gradient(circle, rgba(90, 140, 255, 0.35) 0%, transparent 70%);
    animation: floatA 22s ease-in-out infinite alternate;
  }
  .orb.b {
    width: 38vmax; height: 38vmax;
    bottom: -16vmax; right: -12vmax;
    background: radial-gradient(circle, rgba(197, 160, 255, 0.28) 0%, transparent 70%);
    animation: floatB 26s ease-in-out infinite alternate;
    animation-delay: -6s;
  }
  .orb.c {
    width: 26vmax; height: 26vmax;
    top: 40%; left: 55%;
    background: radial-gradient(circle, rgba(91, 220, 150, 0.18) 0%, transparent 70%);
    animation: floatC 30s ease-in-out infinite alternate;
    animation-delay: -12s;
  }

  @keyframes floatA { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(6vmax,5vmax) scale(1.12); } }
  @keyframes floatB { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-7vmax,-4vmax) scale(1.08); } }
  @keyframes floatC { 0% { transform: translate(-50%,-50%) scale(1); } 100% { transform: translate(-42%,-58%) scale(1.2); } }

  /* ─── Контейнер ───────────────────────────────────────────── */
  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.2rem;
    flex-wrap: wrap;
    margin-bottom: 1.6rem;
    animation: fadeDown 0.7s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  .profile { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  /* ─── Логотип профиля (картинка с Appteka) ────────────────── */
  .avatar {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(122,165,255,0.35);
    flex-shrink: 0;
    position: relative;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    opacity: 0.4;
    animation: pulse 2.5s infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.1); opacity: 0.1; }
  }

  h1 {
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text) 20%, var(--accent) 65%, var(--accent2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; }

  .meta-row {
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .meta-row span { display: flex; align-items: center; gap: 0.3rem; }

  .counter-badge {
    display: inline-block;
    margin-top: 0.6rem;
    padding: 0.22rem 0.9rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .counter-badge b { color: var(--text); font-weight: 700; }

  .header-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

  .profile-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .profile-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.8rem;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    backdrop-filter: blur(10px);
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .profile-links a:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .theme-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
    transition: 0.25s;
    flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--accent); transform: translateY(-2px); }

  /* ─── Тулбар ──────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 1.6rem;
    animation: fadeDown 0.8s 0.08s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  .search-box { position: relative; flex: 1 1 240px; min-width: 200px; }
  .search-box input {
    width: 100%;
    padding: 0.72rem 1rem 0.72rem 2.6rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(122, 165, 255, 0.15);
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 0.9rem; top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    opacity: 0.6;
    pointer-events: none;
  }

  .chips { display: flex; gap: 0.45rem; flex-wrap: wrap; }
  .chip {
    padding: 0.58rem 1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.2s;
    white-space: nowrap;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: linear-gradient(135deg, rgba(122,165,255,0.25), rgba(197,180,255,0.2));
    border-color: rgba(122,165,255,0.5);
    color: var(--text);
  }

  /* ─── Сетка ───────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 1.1rem;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding: 1.4rem;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    transition: transform 0.28s cubic-bezier(0.23, 1, 0.32, 1),
                border-color 0.28s, box-shadow 0.28s;
    animation: cardIn 0.55s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%),
                rgba(122, 165, 255, 0.14), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(122, 165, 255, 0.35);
    box-shadow: var(--shadow);
  }
  .card:hover::after { opacity: 1; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
  .card h2 { font-size: 1.08rem; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .card p { color: var(--muted); font-size: 0.87rem; line-height: 1.55; flex: 1; }

  .card-category {
    font-size: 0.68rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
    margin-top: 0.15rem;
  }

  .card-stats {
    display: flex;
    gap: 0.9rem;
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .card-stats span { display: flex; align-items: center; gap: 0.25rem; }

  .badge {
    font-size: 0.65rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 0.28rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.beta   { background: rgba(255, 196, 87, 0.14); color: #ffc457; border: 1px solid rgba(255,196,87,0.25); }
  .badge.stable { background: rgba(91, 220, 150, 0.13); color: #5bdc96; border: 1px solid rgba(91,220,150,0.25); }
  .badge.wip    { background: rgba(255, 120, 120, 0.13); color: #ff8888; border: 1px solid rgba(255,120,120,0.25); }

  .card-arrow {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: color 0.2s, gap 0.2s;
  }
  .card:hover .card-arrow { color: var(--accent); gap: 0.6rem; }

  /* ─── Empty ───────────────────────────────────────────────── */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 0.95rem;
    display: none;
  }
  .empty.visible { display: block; animation: fadeDown 0.4s both; }

  /* ─── Footer ──────────────────────────────────────────────── */
  footer {
    margin-top: 2.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
    gap: 0.8rem;
    flex-wrap: wrap;
    animation: fadeDown 1s 0.3s both;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ─── Animations ──────────────────────────────────────────── */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 480px) {
    .card { padding: 1.15rem; }
    .card h2 { font-size: 1rem; }
    .toolbar { gap: 0.5rem; }
    .avatar { width: 56px; height: 56px; }
  }
</style>
</head>
<body>

<!-- Живой фон -->
<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>

<div class="wrap">

  <header>
    <div class="profile">
      <!-- Логотип: картинка с Appteka -->
      <div class="avatar" id="profileAvatar">
        <img id="profileLogo" alt="Quantum ACD" src="">
      </div>
      <div>
        <h1 id="profileName">Quantum ACD</h1>
        <p class="subtitle">Приложения, лицензии, презентации и эксперименты</p>
        <div class="meta-row" id="profileMeta"></div>
        <span class="counter-badge" id="counter"><b>0</b> проектов</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="profile-links" id="profileLinks"></div>
      <button class="theme-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <input type="search" id="search" placeholder="Поиск по названию, описанию, тегу…" autocomplete="off">
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-filter="all">Все</button>
      <button class="chip" data-filter="beta">Beta</button>
      <button class="chip" data-filter="stable">Stable</button>
      <button class="chip" data-filter="wip">WIP</button>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">Ничего не найдено — попробуйте другой запрос или фильтр.</div>
  </main>

  <footer>
    <span>Quantum ACD · projects</span>
    <span><a href="https://github.com/q-acd" target="_blank" rel="noopener">GitHub</a> · <a href="https://appteka.store/profile/598037" target="_blank" rel="noopener">💊 Appteka</a></span>
  </footer>
</div>

<script>
(async function () {
  // ─── Загрузка данных ────────────────────────────────────────
  let data;
  try {
    data = await fetch('projects.json').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  } catch (e) {
    console.error('Не удалось загрузить projects.json:', e);
    document.getElementById('grid').innerHTML =
      '<div class="empty visible">Ошибка загрузки данных. Проверьте projects.json.</div>';
    return;
  }

  const profile = data.profile;
  const projects = data.projects;

  // ─── Профиль: логотип-картинка ──────────────────────────────
  const logoImg = document.getElementById('profileLogo');
  logoImg.src = profile.logo;
  logoImg.onerror = () => {
    // Фолбэк: если картинка не загрузилась — показываем таблетку
    document.getElementById('profileAvatar').innerHTML = '💊';
  };

  document.getElementById('profileName').textContent = profile.name;

  const meta = document.getElementById('profileMeta');
  meta.innerHTML = `
    <span>📅 Joined ${profile.joined}</span>
    <span>🟢 ${profile.status}</span>
    <span>📦 ${projects.length} проектов</span>
  `;

  // ─── Ссылки профиля: иконка-таблетка у Appteka ──────────────
  const links = document.getElementById('profileLinks');
  links.innerHTML = `
    <a href="${profile.appteka}" target="_blank" rel="noopener">💊 Appteka</a>
    <a href="${profile.github}" target="_blank" rel="noopener">🐙 GitHub</a>
    <a href="${profile.channel}" target="_blank" rel="noopener">📢 Канал</a>
  `;

  // ─── DOM ────────────────────────────────────────────────────
  const grid    = document.getElementById('grid');
  const empty   = document.getElementById('empty');
  const search  = document.getElementById('search');
  const chips   = document.getElementById('chips');
  const counter = document.getElementById('counter');
  const themeBtn = document.getElementById('themeBtn');

  const state = { query: "", filter: "all" };

  // ─── Escape ─────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ─── Рендер ─────────────────────────────────────────────────
  function render() {
    const q = state.query.trim().toLowerCase();
    const f = state.filter;

    const list = projects.filter(p => {
      const matchFilter = (f === "all") || (p.status === f);
      const haystack = (p.title + " " + p.desc + " " + p.tags.join(" ") + " " + p.category).toLowerCase();
      const matchQuery = !q || haystack.includes(q);
      return matchFilter && matchQuery;
    });

    grid.innerHTML = "";
    empty.classList.toggle("visible", list.length === 0);

    list.forEach((p, i) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = p.url;
      card.style.animationDelay = (i * 55) + 'ms';

      card.addEventListener('pointermove', (e) => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });

      const stats = [];
      if (p.rating)    stats.push(`<span>⭐ ${escapeHtml(p.rating)}</span>`);
      if (p.downloads != null) stats.push(`<span>⬇ ${p.downloads}</span>`);
      if (p.size)      stats.push(`<span>💾 ${escapeHtml(p.size)}</span>`);

      // Бейдж источника: таблетка для Appteka
      const sourceBadge = p.source === 'appteka'
        ? '<span class="badge appteka">💊 Appteka</span>'
        : '';

      card.innerHTML = `
        <div class="card-top">
          <h2>${escapeHtml(p.title)}</h2>
          <span class="badge ${escapeHtml(p.status)}">${escapeHtml(p.status.toUpperCase())}</span>
        </div>
        <div class="card-category">${escapeHtml(p.category)} ${sourceBadge}</div>
        <p>${escapeHtml(p.desc)}</p>
        ${stats.length ? `<div class="card-stats">${stats.join('')}</div>` : ''}
        <div class="card-arrow">Открыть <span>→</span></div>
      `;
      grid.appendChild(card);
    });

    const total = projects.length;
    const word = plural(total, "проект", "проекта", "проектов");
    counter.innerHTML = `<b>${total}</b> ${word}`;
  }

  function plural(n, one, few, many) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
    return many;
  }

  // ─── Поиск с дебаунсом ──────────────────────────────────────
  let t;
  search.addEventListener('input', (e) => {
    clearTimeout(t);
    t = setTimeout(() => {
      state.query = e.target.value;
      render();
    }, 120);
  });

  // ─── Фильтры ────────────────────────────────────────────────
  chips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    chips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.filter;
    render();
  });

  // ─── Тема ───────────────────────────────────────────────────
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.dataset.theme = 'light';
    themeBtn.textContent = '☀️';
  }

  themeBtn.addEventListener('click', () => {
    const isLight = document.documentElement.dataset.theme === 'light';
    if (isLight) {
      delete document.documentElement.dataset.theme;
      themeBtn.textContent = '🌙';
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.dataset.theme = 'light';
      themeBtn.textContent = '☀️';
      localStorage.setItem('theme', 'light');
    }
  });

  // ─── Старт ──────────────────────────────────────────────────
  render();
})();
</script>

<!-- Стиль для бейджа Appteka -->
<style>
  .badge.appteka {
    background: rgba(122, 165, 255, 0.14);
    color: var(--accent);
    border: 1px solid rgba(122,165,255,0.3);
    margin-left: 0.4rem;
  }
</style>
</body>
 </html>
