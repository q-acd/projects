<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Факты об Австралии</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GSQ1XVY3XW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GSQ1XVY3XW');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            /* Случайный тёмный фон задаётся через JS-переменные */
            background: var(--bg-base, #0a0f1e);
            color: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Стеклянные блики поверх фона */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.55;
        }

        body::before {
            width: 60vmax;
            height: 60vmax;
            top: -20vmax;
            left: -15vmax;
            background: var(--blob1, rgba(40, 80, 160, 0.5));
        }

        body::after {
            width: 55vmax;
            height: 55vmax;
            bottom: -22vmax;
            right: -18vmax;
            background: var(--blob2, rgba(90, 60, 160, 0.45));
        }

        /* ============================================
           ОСНОВНАЯ КАРТОЧКА
           ============================================ */
        .fact-card {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(12, 20, 38, 0.55);
            backdrop-filter: blur(26px) saturate(140%);
            -webkit-backdrop-filter: blur(26px) saturate(140%);
            overflow: hidden;
            display: flex;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .fact-left {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(2rem, 5vw, 4.5rem);
            position: relative;
            min-width: 0;
            z-index: 3;
        }

        .fact-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .fact-content::-webkit-scrollbar { width: 4px; }
        .fact-content::-webkit-scrollbar-thumb {
            background: rgba(160, 195, 255, 0.2);
            border-radius: 4px;
        }

        .fact-number {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 800;
            line-height: 1;
            color: rgba(180, 210, 255, 0.12);
            letter-spacing: -0.06em;
            user-select: none;
            font-family: 'Inter', system-ui, sans-serif;
            margin-bottom: 0.2rem;
            transition: color 0.4s, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .fact-card:hover .fact-number {
            color: rgba(180, 210, 255, 0.2);
            transform: translateX(6px);
        }

        .fact-text {
            font-size: clamp(1.15rem, 2vw, 1.85rem);
            line-height: 1.55;
            font-weight: 450;
            color: #f0f5ff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.01em;
            word-break: break-word;
            max-width: 900px;
        }

        /* НИЖНЯЯ ПАНЕЛЬ — ОДНА СТРОКА */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: nowrap;
            margin-top: 1.5rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0ecff;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(8px);
            user-select: none;
            flex-shrink: 0;
            line-height: 1;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(160, 195, 255, 0.15);
            border-color: rgba(180, 210, 255, 0.3);
            transform: scale(1.06);
            color: #ffffff;
            box-shadow: 0 12px 28px -8px rgba(80, 140, 255, 0.3);
        }

        .nav-btn:active:not(:disabled) {
            transform: scale(0.94);
            background: rgba(160, 195, 255, 0.25);
        }

        .nav-btn:disabled { opacity: 0.25; pointer-events: none; }

        /* Прогресс-слайдер */
        .progress-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #a6bce2;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.45rem 1.1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            flex: 1 1 auto;
            min-width: 120px;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s;
        }

        .progress-wrapper:hover {
            background: rgba(160, 195, 255, 0.08);
            border-color: rgba(180, 210, 255, 0.2);
        }

        .progress-wrapper .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            min-width: 40px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7aa5ff, #c5b4ff);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 12px rgba(120, 160, 255, 0.5);
        }

        .progress-wrapper .chevron {
            font-size: 0.7rem;
            opacity: 0.5;
            transition: transform 0.3s;
        }

        .progress-wrapper.open .chevron { transform: rotate(180deg); }

        /* DROPDOWN */
        .fact-dropdown {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            right: 0;
            background: rgba(14, 22, 42, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(160, 195, 255, 0.15);
            border-radius: 16px;
            padding: 0.6rem;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 280px;
            overflow-y: auto;
            z-index: 20;
        }

        .progress-wrapper.open .fact-dropdown {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .fact-dropdown::-webkit-scrollbar { width: 4px; }
        .fact-dropdown::-webkit-scrollbar-thumb {
            background: rgba(160, 195, 255, 0.2);
            border-radius: 4px;
        }

        .dropdown-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem;
        }

        .dropdown-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            color: #a6bce2;
            padding: 0.55rem 0;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: inherit;
        }

        .dropdown-item:hover {
            background: rgba(160, 195, 255, 0.12);
            color: #ffffff;
        }

        .dropdown-item.active {
            background: linear-gradient(135deg, #3a5a9a, #5a4a9a);
            color: #ffffff;
            border-color: rgba(180, 210, 255, 0.3);
            box-shadow: 0 4px 12px -2px rgba(90, 140, 255, 0.4);
        }

        /* ============================================
           ЧЕКБОКС РАНДОМА
           ============================================ */
        .random-toggle {
            position: relative;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c0d4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .random-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .random-toggle .dice {
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .random-toggle:hover {
            background: rgba(160, 195, 255, 0.12);
            border-color: rgba(180, 210, 255, 0.25);
        }

        .random-toggle input:checked ~ .dice {
            transform: rotate(360deg) scale(1.1);
        }

        .random-toggle:has(input:checked) {
            background: linear-gradient(135deg, #3a5a9a, #5a4a9a);
            border-color: rgba(180, 210, 255, 0.35);
            color: #ffffff;
            box-shadow: 0 0 0 4px rgba(120, 160, 255, 0.15),
                        0 8px 20px -6px rgba(80, 140, 255, 0.5);
            animation: randomPulse 2s infinite;
        }

        @keyframes randomPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(120, 160, 255, 0.15), 0 8px 20px -6px rgba(80, 140, 255, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(120, 160, 255, 0.08), 0 8px 24px -6px rgba(80, 140, 255, 0.7); }
        }

        .settings-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c0d4f0;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            flex-shrink: 0;
        }

        .settings-btn:hover {
            background: rgba(160, 195, 255, 0.15);
            border-color: rgba(180, 210, 255, 0.3);
            transform: scale(1.06) rotate(45deg);
        }

        .settings-btn:active { transform: scale(0.94) rotate(45deg); }
        .settings-btn.active { background: rgba(160, 195, 255, 0.2); color: #fff; }

        /* ============================================
           ТАЙМЕР-ПОЛОСКА ПОД ПАНЕЛЬЮ
           ============================================ */
        .timer-strip {
            position: relative;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .timer-strip.visible { opacity: 1; }

        .timer-strip-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7aa5ff, #7affb0, #c5b4ff);
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(122, 165, 255, 0.6);
            transition: none;
        }

        /* ============================================
           ПАНЕЛЬ НАСТРОЕК
           ============================================ */
        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: min(380px, 92vw);
            height: 100%;
            background: rgba(12, 20, 38, 0.9);
            backdrop-filter: blur(28px) saturate(140%);
            border-left: 1px solid rgba(160, 195, 255, 0.12);
            box-shadow: -20px 0 60px -20px rgba(0, 0, 0, 0.9);
            padding: 2rem 1.6rem;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
            transform: translateX(105%);
            transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 100;
            overflow-y: auto;
        }

        .settings-panel.open { transform: translateX(0); }

        .settings-panel::-webkit-scrollbar { width: 4px; }
        .settings-panel::-webkit-scrollbar-thumb {
            background: rgba(160, 195, 255, 0.2);
            border-radius: 4px;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .settings-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #a0c4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c0d4f0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-close:hover {
            background: rgba(255, 100, 100, 0.15);
            border-color: rgba(255, 150, 150, 0.3);
        }

        .settings-section { display: flex; flex-direction: column; gap: 0.7rem; }

        .settings-section > label {
            font-size: 0.78rem;
            color: #9ab0d8;
            letter-spacing: 0.06em;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ============================================
           ЧИП-СЛАЙДЕР
           ============================================ */
        .chips {
            display: flex;
            gap: 0.25rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.3rem;
            border-radius: 40px;
            position: relative;
            justify-content: space-between;
            width: 100%;
        }

        .chip {
            flex: 1 1 0;
            min-width: 0;
            background: transparent;
            border: none;
            color: #8ea4c8;
            padding: 0.5rem 0;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
            white-space: nowrap;
            position: relative;
            font-family: inherit;
            z-index: 2;
            text-align: center;
        }

        .chip:hover { color: #c0d8ff; }
        .chip.active { color: #ffffff; }

        .chip-indicator {
            position: absolute;
            top: 0.3rem;
            left: 0;
            height: calc(100% - 0.6rem);
            border-radius: 30px;
            background: linear-gradient(135deg, #3a5a9a, #5a4a9a);
            box-shadow: 0 4px 16px -4px rgba(90, 140, 255, 0.5),
                        0 0 0 1px rgba(180, 210, 255, 0.2) inset;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            will-change: transform, width;
        }

        .chip-indicator.ready { opacity: 1; }

        /* ============================================
           МЕЛОДИИ
           ============================================ */
        .melody-list {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .melody-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .melody-item:hover {
            background: rgba(160, 195, 255, 0.08);
            border-color: rgba(180, 210, 255, 0.2);
            transform: translateX(2px);
        }

        .melody-item.active {
            background: linear-gradient(135deg, rgba(58, 90, 154, 0.5), rgba(90, 74, 154, 0.5));
            border-color: rgba(180, 210, 255, 0.35);
            box-shadow: 0 4px 20px -6px rgba(90, 140, 255, 0.5);
        }

        .melody-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(120, 160, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: all 0.25s;
        }

        .melody-item.active .melody-icon {
            background: rgba(120, 255, 180, 0.2);
            animation: melodyPulse 1.8s infinite;
        }

        @keyframes melodyPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(120, 255, 180, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(120, 255, 180, 0); }
        }

        .melody-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .melody-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: #d0e0ff;
        }

        .melody-desc {
            font-size: 0.72rem;
            color: #8ea4c8;
            opacity: 0.8;
        }

        .melody-item .eq-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 16px;
            width: 18px;
            opacity: 0;
            transition: opacity 0.25s;
            flex-shrink: 0;
        }

        .melody-item.active .eq-bars { opacity: 1; }

        .eq-bars span {
            width: 2px;
            background: linear-gradient(to top, #7affb0, #7aa5ff);
            border-radius: 2px;
            animation: eqBounce 0.9s ease-in-out infinite;
        }

        .eq-bars span:nth-child(2) { animation-delay: 0.15s; }
        .eq-bars span:nth-child(3) { animation-delay: 0.3s; }
        .eq-bars span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes eqBounce {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-top: 0.6rem;
        }

        .volume-row span {
            font-size: 0.75rem;
            color: #8ea4c8;
            flex-shrink: 0;
            min-width: 60px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7aa5ff, #c5b4ff);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(120, 160, 255, 0.6);
            transition: transform 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .volume-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #7aa5ff, #c5b4ff);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(120, 160, 255, 0.6);
        }

        /* Автопереключение */
        .auto-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.8rem 1rem;
        }

        .auto-toggle-row .auto-text {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.88rem;
            color: #d0ddf0;
        }

        .auto-toggle-row .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #7aa5ff;
            box-shadow: 0 0 10px rgba(120, 160, 255, 0.6);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .auto-toggle-row .dot.active {
            background: #7affb0;
            box-shadow: 0 0 10px rgba(120, 255, 180, 0.7);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .auto-progress-ring { width: 18px; height: 18px; flex-shrink: 0; }
        .auto-progress-ring circle { fill: none; stroke-width: 2.5; transition: stroke-dashoffset 0.3s linear; }

        /* Оверлей */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 90;
        }

        .settings-overlay.open { opacity: 1; pointer-events: auto; }

        /* ============================================
           БЛОК АВТОРОВ
           ============================================ */
        .credits {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 1rem 1.1rem;
            font-size: 0.84rem;
            line-height: 1.5;
            color: #c8d8f0;
        }

        .credits-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .credits-role {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #7aa5ff;
            text-transform: uppercase;
            margin-bottom: 0.15rem;
        }

        .credits-names {
            color: #e8f0ff;
            font-weight: 500;
        }

        /* Анимации появления */
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .fact-number, .fact-text, .nav-controls {
            animation: fadeSlideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both;
        }
        .fact-text { animation-delay: 0.08s; }
        .nav-controls { animation-delay: 0.16s; }

        .fact-card.changed .fact-number,
        .fact-card.changed .fact-text,

            const total = facts.length;
            let currentIndex = 0;

            // DOM
            const factCard = document.getElementById('factCard');

            const settingsOverlay = document.getElementById('settingsOverlay');
            const settingsClose = document.getElementById('settingsClose');
            const chipsContainer = document.getElementById('chips');

            // =============================================
            // DROPDOWN

            facts.forEach((_, i) => {

                    renderFact(i);
                    closeDropdown();

                if (progressWrapper.classList.contains('open')) closeDropdown();
                else openDropdown();
            }

            progressWrapper.addEventListener('click', (e) => {
                if (e.target.closest('.fact-dropdown')) return;
                toggleDropdown();
            });

            document.addEventListener('click', (e) => {
                if (!progressWrapper.contains(e.target)) closeDropdown();
            });

            // =============================================
            // ЛОГИКА ФАКТОВ
            // =============================================
            function formatNumber(num) { return String(num).padStart(2, '0'); }

            function renderFact(index, animate = true) {
                if (index < 0) index = 0;
                if (index >= total) index = total - 1;

                currentIndex = index;

                if (animate) {
                    factCard.classList.remove('changed');
                    void factCard.offsetWidth;
                    factCard.classList.add('changed');
                    [factNumberEl, factTextEl].forEach(el => {
                        el.style.animation = 'none';
                        void el.offsetWidth;
                        el.style.animation = '';
                    });
                }

                factNumberEl.textContent = formatNumber(index + 1);
                factTextEl.textContent = facts[index].text;

                progressLabel.textContent = `${index + 1} / ${total}`;
                progressFill.style.width = ((index + 1) / total) * 100 + '%';

                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === total - 1);

                updateDropdownActive();
                resetAutoTimer();
            }

            function goPrev() { if (currentIndex > 0) renderFact(currentIndex - 1); }
            function goNext() {
                if (randomCheckbox.checked) {
                    if (total <= 1) return;
                    let newIndex;
                    do { newIndex = Math.floor(Math.random() * total); }
                    while (newIndex === currentIndex);
                    renderFact(newIndex);
                } else if (currentIndex < total - 1) {
                    renderFact(currentIndex + 1);
                } else if (autoIntervalSec > 0) {
                    renderFact(0);
                }
            }

            prevBtn.addEventListener('click', goPrev);
            nextBtn.addEventListener('click', goNext);

                if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
                else if (e.key === 'Escape') {
                    closeDropdown();
                    closeSettings();
                }
            });

            factCard.addEventListener('touchend', (e) => {
                const diff = e.changedTouches[0].screenX - touchStartX;
                if (Math.abs(diff) > 60) {

                }

            let autoTimer = null;
            let autoProgressStart = 0;
            let autoProgressRAF = null;
            const ringCircumference = 2 * Math.PI * 8;

            function updateAutoProgress() {
                if (autoIntervalSec <= 0) {
                    autoRing.style.display = 'none';
                    autoDot.classList.remove('active');
                    timerStrip.classList.remove('visible');
                    timerStripFill.style.width = '0%';
                    return;

                autoRing.style.display = 'inline-block';
                autoDot.classList.add('active');
                timerStrip.classList.add('visible');

                const elapsed = (performance.now() - autoProgressStart) / 1000;
                const prog = Math.min(elapsed / autoIntervalSec, 1);

                // Круговой индикатор в настройках

                // Полоска внизу

                if (prog < 1) {
                    autoProgressRAF = requestAnimationFrame(updateAutoProgress);

            function resetAutoTimer() {
                if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }

                    autoRing.style.display = 'none';
                    autoDot.classList.remove('active');
                    autoStatus.textContent = 'Выключено';

                    timerStripFill.style.width = '0%';

            let audioCtx = null;
            let masterGain = null;
            let limiter = null;
            let currentMelody = null;
            let isPlaying = false;
            let scheduledNodes = [];
            let musicLoopTimer = null;
            let musicVolume = 0.35;

            function initAudio() {
                if (audioCtx) return;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                limiter = audioCtx.createDynamicsCompressor();
                limiter.threshold.setValueAtTime(-8, audioCtx.currentTime);
                limiter.knee.setValueAtTime(0, audioCtx.currentTime);
                limiter.ratio.setValueAtTime(20, audioCtx.currentTime);
                limiter.attack.setValueAtTime(0.002, audioCtx.currentTime);
                limiter.release.setValueAtTime(0.15, audioCtx.currentTime);
                limiter.connect(audioCtx.destination);

                masterGain = audioCtx.createGain();
                masterGain.gain.value = musicVolume;
                masterGain.connect(limiter);
            }

            function makeFilter(freq) {
                const f = audioCtx.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.setValueAtTime(freq, audioCtx.currentTime);
                f.Q.setValueAtTime(0.7, audioCtx.currentTime);
                return f;
            }

            function playNote(freq, startTime, duration, type = 'sine', volume = 0.08) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = makeFilter(3200);

                osc.type = type;
                osc.frequency.value = freq;

                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(volume, startTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(masterGain);
                osc.start(startTime);
                osc.stop(startTime + duration + 0.05);
                scheduledNodes.push(osc);
            }

            function scheduleMelodyCycle(melody, startTime) {
                const noteDur = melody.tempo;
                const beatDur = noteDur * 4;
                const totalBars = melody.melodyPattern.length;

                for (let bar = 0; bar < totalBars; bar++) {
                    const barStart = startTime + bar * beatDur;
                    melody.melodyPattern[bar].forEach((freq, i) => {
                        const noteStart = barStart + i * noteDur;
                        playNote(freq, noteStart, noteDur * 1.5, melody.waveType, melody.volume * 0.7);
                        playNote(freq * 2, noteStart, noteDur * 0.8, melody.harmonyType, melody.volume * 0.15);
                    });
                    playNote(melody.bassPattern[bar], barStart, beatDur * 0.95, 'sine', melody.volume * 0.5);
                }
                return startTime + totalBars * beatDur;
            }

            function startMusic() {
                if (!currentMelody) return;
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                isPlaying = true;
                updateMelodyUI();

                if (masterGain) {
                    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    masterGain.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
                }

                const now = audioCtx.currentTime + 0.1;
                let nextCycleStart = scheduleMelodyCycle(currentMelody, now);

                function scheduleNext() {
                    if (!isPlaying) return;
                    const nextStart = nextCycleStart;
                    nextCycleStart = scheduleMelodyCycle(currentMelody, nextStart);
                    const checkIn = (nextStart - audioCtx.currentTime - 2) * 1000;
                    musicLoopTimer = setTimeout(scheduleNext, Math.max(checkIn, 100));
                }

                const beatDur = currentMelody.tempo * 4;
                const totalDur = currentMelody.melodyPattern.length * beatDur;
                const firstCheckIn = (nextCycleStart - audioCtx.currentTime - 2) * 1000;
                musicLoopTimer = setTimeout(scheduleNext, Math.max(firstCheckIn, 100));
            }

            function stopMusic() {
                isPlaying = false;
                updateMelodyUI();

                if (musicLoopTimer) {
                    clearTimeout(musicLoopTimer);
                    musicLoopTimer = null;
                }

                if (masterGain && audioCtx) {
                    const now = audioCtx.currentTime;
                    masterGain.gain.cancelScheduledValues(now);
                    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
                    masterGain.gain.linearRampToValueAtTime(0, now + 0.3);

                    setTimeout(() => {
                        scheduledNodes.forEach(node => {
                            try { node.stop(); } catch(e) {}
                        });
                        scheduledNodes = [];
                        if (masterGain) {
                            masterGain.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
                        }
                    }, 400);
                }
            }

            function selectMelody(melody) {
                const wasPlaying = isPlaying;
                if (isPlaying) stopMusic();
                currentMelody = melody;
                renderMelodyList();
                if (wasPlaying) {
                    setTimeout(() => startMusic(), 450);
                }
            }

            function updateMelodyUI() {
                document.querySelectorAll('.melody-item').forEach(item => {
                    const isActive = currentMelody && item.dataset.id === currentMelody.id && isPlaying;
                    item.classList.toggle('active', isActive);
                });
            }

            function renderMelodyList() {
                melodyList.innerHTML = '';
                MELODIES.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'melody-item';
                    item.dataset.id = m.id;

                    const isActive = currentMelody && currentMelody.id === m.id && isPlaying;
                    if (isActive) item.classList.add('active');

                    item.innerHTML = `
                        <div class="melody-icon">${m.icon}</div>
                        <div class="melody-info">
                            <div class="melody-name">${m.name}</div>
                            <div class="melody-desc">${m.desc}</div>
                        </div>
                        <div class="eq-bars">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    `;

                    item.addEventListener('click', () => {
                        if (currentMelody && currentMelody.id === m.id) {
                            if (isPlaying) stopMusic();
                            else startMusic();
                        } else {
                            selectMelody(m);
                        }
                    });

                    melodyList.appendChild(item);
                });
            }

            volumeSlider.addEventListener('input', (e) => {
                musicVolume = parseInt(e.target.value, 10) / 100;
                if (masterGain && audioCtx && isPlaying) {
                    masterGain.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
                }
            });

            // =============================================
            // ИНИЦИАЛИЗАЦИЯ
            // =============================================
            renderMelodyList();
            currentMelody = MELODIES[0];

            renderFact(0, false);
            prevBtn.disabled = true;
            nextBtn.disabled = (total <= 1);
            progressFill.style.width = (1 / total * 100) + '%';

            function repositionChipIndicator() {
                const activeChip = chipsContainer.querySelector('.chip.active');
                if (activeChip) positionChipIndicator(activeChip);
            }

            requestAnimationFrame(() => {
                repositionChipIndicator();
                setTimeout(repositionChipIndicator, 150);
                setTimeout(repositionChipIndicator, 400);
            });

            window.addEventListener('resize', () => {
                repositionChipIndicator();
            });

            const originalOpenSettings = openSettings;
            window.openSettings = function() {
                originalOpenSettings();
                setTimeout(repositionChipIndicator, 50);
                setTimeout(repositionChipIndicator, 500);
            };
        })();
