<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>QMidApp</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&family=Montserrat:wght@400;600&family=Pacifico&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --radius:8px; --accent:#4f8cff; --accent-hover:#6b9dff; --accent-text:#fff;
  --font:'Segoe UI',system-ui,sans-serif;
  --titlebar:#181a20; --titlebar-text:#e8e8e8;
  --win-bg:#1f2128; --win-border:#2f333d;
  --panel:#262932; --panel-2:#2f333d; --panel-3:#3a3f4b;
  --text:#e8ebf2; --text-dim:#8b93a7;
  --danger:#e5484d; --danger-hover:#f06066;
  --warning:#f59f00; --info:#4f8cff; --success:#2f9e44;
  --tabbar:#15171c; --shadow:0 20px 60px rgba(0,0,0,.55);
  --input-bg:#12141a; --border:#3a3f4b; --taskbar:#14161b;
  --btn-radius:4px; --panel-radius:6px;
}
:root[data-theme="light"]{
  --titlebar:#eef0f4; --titlebar-text:#1f2328;
  --win-bg:#f6f7f9; --win-border:#d4d7dd;
  --panel:#ffffff; --panel-2:#eef0f3; --panel-3:#e1e4e9;
  --text:#1f2328; --text-dim:#57606a;
  --tabbar:#f0f2f5; --shadow:0 12px 40px rgba(0,0,0,.12);
  --input-bg:#ffffff; --border:#d4d7dd; --taskbar:#e6e8ec;
  --accent-text:#ffffff;
}
/* XP */
:root[data-style="xp"]{
  --radius:0; --btn-radius:2px; --panel-radius:2px;
  --font:Tahoma,'Segoe UI',sans-serif;
  --titlebar:linear-gradient(180deg,#0058ee,#3f8cf3 8%,#0054e3 40%,#0054e3);
  --titlebar-text:#fff;
  --win-bg:#ece9d8; --win-border:#0054e3;
  --panel:#f1efe2; --panel-2:#e3dfd0; --panel-3:#d4cfbe;
  --text:#000; --text-dim:#5a5a5a;
  --tabbar:#d4d0c8; --input-bg:#fff; --border:#a0a0a0;
  --shadow:2px 2px 8px rgba(0,0,0,.4);
}
/* 98 */
:root[data-style="98"]{
  --radius:0; --btn-radius:0; --panel-radius:0;
  --font:'MS Sans Serif',Tahoma,sans-serif;
  --titlebar:linear-gradient(90deg,#000080,#1084d0);
  --titlebar-text:#fff;
  --win-bg:#c0c0c0; --win-border:#808080;
  --panel:#c0c0c0; --panel-2:#d4d0c8; --panel-3:#a0a0a0;
  --text:#000; --text-dim:#404040;
  --tabbar:#c0c0c0; --input-bg:#fff; --border:#808080;
  --shadow:2px 2px 0 #000; --accent:#000080;
}
/* macOS */
:root[data-style="mac"]{
  --radius:12px; --btn-radius:8px; --panel-radius:10px;
  --font:-apple-system,'SF Pro Display','Inter',sans-serif;
  --titlebar:linear-gradient(180deg,#eef0f4,#dde1e8); --titlebar-text:#1a1a1a;
  --win-bg:#f6f6f8; --win-border:#c9c9ce;
  --panel:rgba(255,255,255,.95); --panel-2:rgba(240,241,245,.92); --panel-3:rgba(224,226,232,.92);
  --text:#1d1d1f; --text-dim:#6e6e73;
  --tabbar:#e8eaf0; --input-bg:#ffffff; --border:#d2d2d7;
  --shadow:0 16px 48px rgba(0,0,0,.22); --accent:#007aff; --accent-hover:#0066d6;
  --danger:#ff3b30; --warning:#ff9500; --success:#34c759;
}
:root[data-style="mac"] .win .titlebar{padding-left:74px;position:relative;}
:root[data-style="mac"] .win .titlebar::before{
  content:'';position:absolute;left:12px;top:12px;width:12px;height:12px;border-radius:50%;
  background:#ff5f57;box-shadow:20px 0 0 #febc2e,40px 0 0 #28c840;
}
:root[data-style="mac"] .win .win-btn{display:none;}
:root[data-style="mac"] button.btn{border-radius:8px;}
:root[data-style="mac"] .tab{border-radius:8px;border-bottom-color:transparent;}
:root[data-style="mac"] .tab.active{background:rgba(0,122,255,.12);border-bottom-color:transparent;}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;font-family:var(--font);font-size:13px;}
body{background:#000;color:var(--text);user-select:none;-webkit-tap-highlight-color:transparent;}

#wallpaper{position:fixed;inset:0;z-index:0;background-color:#0f1115;background-size:cover;background-position:center;background-repeat:no-repeat;}
#wallpaperVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none;}
#desktop{position:fixed;inset:0 0 48px 0;z-index:1;pointer-events:none;}
#desktop .shortcut{pointer-events:auto;}
.shortcut{position:absolute;width:88px;text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.8);cursor:pointer;padding:6px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.shortcut:hover{background:rgba(255,255,255,.12);}
.shortcut .sc-icon{width:46px;height:46px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.shortcut .sc-icon .material-icons{font-size:26px;color:#fff;}
.shortcut .sc-label{word-break:break-word;line-height:1.2;}

.win{position:fixed;background:var(--win-bg);border:1px solid var(--win-border);box-shadow:var(--shadow);display:flex;flex-direction:column;color:var(--text);overflow:hidden;border-radius:var(--radius);z-index:10;min-width:520px;min-height:360px;}
.win.maximized{left:0!important;top:0!important;width:100vw!important;height:calc(100vh - 48px)!important;border-radius:0;border:0;}
.win.minimized{display:none;}
.win .titlebar{height:34px;background:var(--titlebar);color:var(--titlebar-text);display:flex;align-items:center;padding-left:12px;font-size:12px;flex-shrink:0;border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);position:relative;}
:root[data-style="xp"] .win .titlebar,:root[data-style="98"] .win .titlebar{padding-left:4px;font-weight:700;}
.win.maximized .titlebar{border-radius:0;}
.win .titlebar .title{flex:1;display:flex;align-items:center;gap:6px;letter-spacing:.2px;}
.win-btn{width:46px;height:34px;background:transparent;border:0;color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.win-btn .material-icons{font-size:16px;}
.win-btn:hover{background:rgba(255,255,255,.08);}
:root[data-theme="light"] .win-btn:hover{background:rgba(0,0,0,.06);}
:root[data-style="xp"] .win-btn,:root[data-style="98"] .win-btn{width:20px;height:18px;margin-right:2px;background:var(--panel-2);border:1px solid var(--border);border-radius:2px;}
:root[data-style="xp"] .win-btn:hover,:root[data-style="98"] .win-btn:hover{background:var(--panel-3);}
.win-btn.close:hover{background:var(--danger);color:#fff;}

.topbar{display:flex;align-items:stretch;height:44px;flex-shrink:0;background:var(--tabbar);border-bottom:1px solid var(--border);gap:2px;padding:0 8px;overflow-x:auto;}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-dim);padding:0 16px;font-size:12px;font-family:var(--font);cursor:pointer;transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tab:hover{background:var(--panel-2);color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel);}
.tab .material-icons{font-size:16px;}
.topbar .spacer{flex:1;}

.transport{flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.transport .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.transport .grow{flex:1;min-width:120px;}
.progress{height:8px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--btn-radius);overflow:hidden;cursor:pointer;}
.progress>div{height:100%;width:0%;background:var(--accent);pointer-events:none;transition:width .08s linear;}
.visualizer{height:36px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--btn-radius);overflow:hidden;margin-top:6px;}
.visualizer.hidden{display:none;}
.visualizer canvas{width:100%;height:100%;display:block;}

.content{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--panel-radius);padding:14px 16px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.section-title .material-icons{font-size:14px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

button.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--btn-radius);padding:7px 14px;font-size:13px;cursor:pointer;font-family:var(--font);transition:background .12s,border-color .12s;display:inline-flex;align-items:center;gap:6px;}
button.btn .material-icons{font-size:16px;}
button.btn:hover:not(:disabled){background:var(--panel-3);border-color:var(--accent);}
button.btn:disabled{opacity:.45;cursor:default;}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
button.btn.primary:hover:not(:disabled){background:var(--accent-hover);}
button.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}

input[type=range]{width:100%;accent-color:var(--accent);}
input[type=number],select,input[type=text]{background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--btn-radius);padding:6px 8px;font-size:13px;font-family:var(--font);max-width:100%;}
select:focus,input:focus{outline:1px solid var(--accent);}
label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);}
label.field>b{color:var(--text);}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--btn-radius);background:var(--panel-2);border:1px solid var(--border);font-size:11px;color:var(--text-dim);}
.status{font-size:12px;color:var(--text-dim);min-height:16px;}

.fl-track{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--panel-radius);margin-bottom:10px;overflow:hidden;}
.fl-track-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border-bottom:1px solid var(--border);}
.fl-track-header .num{font-weight:700;color:var(--accent);font-size:12px;min-width:20px;}
.fl-track-header .name{flex:1;font-size:12px;font-weight:600;}
.fl-track-header .ch{font-size:10px;color:var(--text-dim);}
.fl-track-header .mini-btns{display:flex;gap:4px;}
.fl-track-header .mini-btns button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:var(--btn-radius);padding:3px 8px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-family:var(--font);}
.fl-track-header .mini-btns button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.fl-track-header .mini-btns .material-icons{font-size:14px;}
.fl-track-body{padding:8px 12px;}
.fl-pianoroll{height:70px;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--btn-radius);position:relative;overflow:hidden;margin-bottom:8px;}
.fl-pianoroll canvas{width:100%;height:100%;display:block;}
.fl-track-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fl-track-controls label{font-size:11px;color:var(--text-dim);display:flex;flex-direction:column;gap:2px;min-width:90px;flex:1;}
.fl-track-controls label>b{color:var(--text);font-weight:400;font-size:11px;}

.wallpaper-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.wp-thumb{aspect-ratio:16/10;border-radius:var(--btn-radius);border:2px solid var(--border);background-size:cover;background-position:center;background-repeat:no-repeat;cursor:pointer;transition:border-color .12s;}
.wp-thumb:hover{border-color:var(--accent);}
.wp-thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);}
.accent-grid{display:flex;gap:8px;flex-wrap:wrap;}
.accent-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid var(--border);transition:transform .1s;}
.accent-dot:hover{transform:scale(1.1);}
.accent-dot.active{border-color:var(--text);}

/* УВЕДОМЛЕНИЯ */
.notif-modal{position:fixed;z-index:5000;min-width:340px;max-width:460px;background:var(--win-bg);border:1px solid var(--win-border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;color:var(--text);overflow:hidden;animation:errIn .15s ease-out;}
@keyframes errIn{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.notif-titlebar{height:32px;background:var(--titlebar);color:var(--titlebar-text);display:flex;align-items:center;padding-left:12px;font-size:12px;cursor:move;touch-action:none;}
.notif-titlebar .etitle{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;}
.notif-body{padding:16px;display:flex;flex-direction:column;gap:14px;user-select:text;}
.notif-msg{font-size:12px;line-height:1.5;color:var(--text);white-space:pre-wrap;}
.notif-actions{display:flex;justify-content:flex-end;gap:8px;}
.notif-icon{font-size:28px;}
.notif-icon.error{color:var(--danger);}
.notif-icon.warning{color:var(--warning);}
.notif-icon.info{color:var(--info);}

.toast-container{position:fixed;right:16px;bottom:64px;z-index:7000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{pointer-events:auto;min-width:280px;max-width:360px;background:var(--win-bg);border:1px solid var(--win-border);border-left:4px solid var(--info);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.4);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:12px;animation:toastIn .3s ease-out;}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warning);}
.toast.info{border-left-color:var(--info);}
.toast.success{border-left-color:var(--success);}
.toast .material-icons{font-size:20px;flex-shrink:0;}
.toast.error .material-icons{color:var(--danger);}
.toast.warning .material-icons{color:var(--warning);}
.toast.info .material-icons{color:var(--info);}
.toast.success .material-icons{color:var(--success);}
.toast .toast-body{flex:1;}
.toast .toast-title{font-weight:600;margin-bottom:2px;}
.toast .toast-close{background:transparent;border:0;color:var(--text-dim);cursor:pointer;padding:0;}
@keyframes toastIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes toastOut{from{transform:translateX(0);opacity:1;}to{transform:translateX(120%);opacity:0;}}

/* TASKBAR */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;background:var(--taskbar);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;z-index:4000;gap:6px;box-shadow:0 -4px 16px rgba(0,0,0,.2);}
.start-btn{width:42px;height:42px;border-radius:var(--btn-radius);border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.start-btn:hover{background:var(--panel-2);}
.start-btn .material-icons{font-size:22px;color:var(--accent);}
.taskbar-icons{flex:1;display:flex;gap:6px;overflow-x:auto;justify-content:center;}
.task-icon{min-width:44px;height:40px;border-radius:var(--btn-radius);border:1px solid transparent;background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0 10px;gap:6px;font-size:11px;white-space:nowrap;}
.task-icon:hover{background:var(--panel-3);}
.task-icon.active{border-color:var(--accent);}
.task-icon.pinned::before{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:2px;background:var(--accent);border-radius:2px;}
.task-icon .material-icons{font-size:18px;}
.taskbar-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:11px;line-height:1.3;color:var(--text);padding:0 12px;min-width:90px;}
.taskbar-clock .time{font-weight:600;}
.taskbar-clock .date{color:var(--text-dim);font-size:10px;}

.task-preview{position:fixed;z-index:6000;background:var(--win-bg);border:1px solid var(--win-border);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.5);padding:12px;min-width:240px;color:var(--text);display:none;}
.task-preview.show{display:block;}
.task-preview .tp-name{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.task-preview .tp-actions{display:flex;gap:6px;flex-wrap:wrap;}
.task-preview .tp-actions button{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:var(--btn-radius);padding:5px 10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:var(--font);}
.task-preview .tp-actions button:hover{background:var(--panel-3);}
.task-preview .tp-actions .material-icons{font-size:14px;}

.start-menu{position:fixed;left:8px;bottom:56px;z-index:5000;width:280px;max-height:70vh;overflow:auto;background:var(--win-bg);border:1px solid var(--win-border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.6);padding:10px;display:none;color:var(--text);}
.start-menu.show{display:block;}
.start-menu .sm-header{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);padding:6px 10px;margin-top:4px;}
.start-menu button{width:100%;background:transparent;border:0;color:var(--text);padding:9px 12px;font-size:13px;font-family:var(--font);text-align:left;cursor:pointer;border-radius:var(--btn-radius);display:flex;align-items:center;gap:10px;}
.start-menu button:hover{background:var(--panel-2);}
.start-menu button .material-icons{font-size:16px;color:var(--accent);}
.start-menu hr{border:0;border-top:1px solid var(--border);margin:6px 0;}

/* Dialog */
.dlg-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8000;display:flex;align-items:center;justify-content:center;}
.dlg{background:var(--win-bg);border:1px solid var(--win-border);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.6);min-width:400px;max-width:520px;color:var(--text);overflow:hidden;animation:errIn .15s ease-out;}
.dlg-tb{height:32px;background:var(--titlebar);color:var(--titlebar-text);display:flex;align-items:center;padding:0 12px;font-size:12px;font-weight:600;gap:6px;}
.dlg-tb .material-icons{font-size:16px;}
.dlg-body{padding:16px;display:flex;flex-direction:column;gap:10px;}
.dlg-body label{font-size:11px;color:var(--text-dim);display:flex;flex-direction:column;gap:4px;}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--border);}

/* Sequencer */
.seq-wrap{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--panel-radius);padding:14px;}
.seq-grid{display:grid;grid-template-columns:60px repeat(8,1fr);gap:4px;margin-bottom:12px;}
.seq-label{font-size:11px;color:var(--text-dim);display:flex;align-items:center;padding-left:4px;height:32px;}
.seq-cell{height:32px;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;transition:background .1s,box-shadow .05s;position:relative;}
.seq-cell:hover{border-color:var(--accent);}
.seq-cell.on{background:var(--accent);border-color:var(--accent);}
.seq-cell.playhead{box-shadow:inset 0 0 0 2px var(--warning);}
.seq-cell.beat{background:var(--panel-3);}
.seq-cell.on.beat{background:var(--accent);filter:brightness(1.1);}

/* новогоднее */
.xmas .titlebar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:repeating-linear-gradient(90deg,#ff5e7e 0 12px,#f5c542 12px 24px,#4f8cff 24px 36px,#2f9e44 36px 48px);animation:xmasGlow 2s linear infinite;pointer-events:none;}
@keyframes xmasGlow{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}}
.xmas::before{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.9),transparent),radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,.9),transparent),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,.9),transparent),radial-gradient(2px 2px at 40% 80%,rgba(255,255,255,.9),transparent);background-size:400px 400px;animation:snofall 10s linear infinite;opacity:.5;}
@keyframes snofall{from{background-position:0 0;}to{background-position:0 400px;}}

@media (max-width:700px){.win{min-width:0;}.wallpaper-grid{grid-template-columns:repeat(2,1fr);}.taskbar-clock{min-width:70px;font-size:10px;}.seq-grid{grid-template-columns:40px repeat(8,1fr);}}
</style>
</head>
<body>
<div id="wallpaper"></div>
<video id="wallpaperVideo" autoplay loop muted playsinline></video>
<div id="desktop"></div>

<div class="win" id="mainWin">
  <div class="titlebar" id="titlebar">
    <div class="title"><b>QMidApp</b> <span style="color:var(--text-dim);font-size:11px">v26-nov-2.8</span></div>
    <button class="win-btn" id="btnMinimize"><span class="material-icons">remove</span></button>
    <button class="win-btn" id="btnMaximize"><span class="material-icons">crop_square</span></button>
    <button class="win-btn close" id="btnCloseWin"><span class="material-icons">close</span></button>
  </div>
  <div class="topbar" id="topbar">
    <button class="tab" data-tab="file"><span class="material-icons">folder</span><span data-i18n="tabFile">Файл</span></button>
    <button class="tab" data-tab="editor"><span class="material-icons">piano</span><span data-i18n="tabEditor">Редактор</span></button>
    <button class="tab" data-tab="daw"><span class="material-icons">grid_on</span><span data-i18n="tabDaw">Секвенсор</span></button>
    <button class="tab" data-tab="settings"><span class="material-icons">settings</span><span data-i18n="tabSettings">Настройки</span></button>
    <button class="tab" data-tab="about"><span class="material-icons">info</span><span data-i18n="tabAbout">О программе</span></button>
    <div class="spacer"></div>
  </div>
  <div class="transport">
    <div class="row">
      <button class="btn primary" id="play" disabled><span class="material-icons">play_arrow</span><span data-i18n="play">Играть</span></button>
      <button class="btn" id="pause" disabled><span class="material-icons">pause</span><span data-i18n="pause">Пауза</span></button>
      <button class="btn danger" id="stop" disabled><span class="material-icons">stop</span><span data-i18n="stop">Стоп</span></button>
      <div class="grow" style="display:flex;align-items:center;gap:8px">
        <span class="material-icons" style="font-size:16px;color:var(--text-dim)">volume_up</span>
        <input type="range" id="masterVol" min="0" max="100" value="70" style="flex:1">
      </div>
      <span class="badge" id="meta">—</span>
    </div>
    <div class="progress" id="progress"><div id="bar"></div></div>
    <div class="visualizer" id="vizBox"><canvas id="visCanvas" width="800" height="36"></canvas></div>
    <div class="status" id="status"></div>
  </div>
  <div class="content" id="content"></div>
  <div class="resize-handle" id="resizeHandle" style="position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--border) 50%);z-index:20"></div>
</div>

<div class="taskbar">
  <button class="start-btn" id="startBtn"><span class="material-icons">piano</span></button>
  <div class="taskbar-icons" id="taskbarIcons"></div>
  <div class="taskbar-clock"><span class="time" id="clockTime">--:--</span><span class="date" id="clockDate">--.--.----</span></div>
</div>

<div class="start-menu" id="startMenu">
  <div class="sm-header" data-i18n="apps">Приложения</div>
  <button data-open-tab="file"><span class="material-icons">folder</span><span data-i18n="tabFile">Файл</span></button>
  <button data-open-tab="editor"><span class="material-icons">piano</span><span data-i18n="tabEditor">Редактор</span></button>
  <button data-open-tab="daw"><span class="material-icons">grid_on</span><span data-i18n="tabDaw">Секвенсор</span></button>
  <button data-open-tab="settings"><span class="material-icons">settings</span><span data-i18n="tabSettings">Настройки</span></button>
  <button data-open-tab="about"><span class="material-icons">info</span><span data-i18n="tabAbout">О программе</span></button>
  <hr>
  <button id="smRestoreWin"><span class="material-icons">open_in_full</span><span data-i18n="restore">Показать окно</span></button>
  <button id="smQuit"><span class="material-icons">power_settings_new</span><span data-i18n="quit">Выход</span></button>
</div>

<div class="task-preview" id="taskPreview">
  <div class="tp-name"><span class="material-icons">piano</span>QMidApp</div>
  <div class="tp-actions">
    <button data-tp-action="open"><span class="material-icons">open_in_new</span><span data-i18n="open">Открыть</span></button>
    <button data-tp-action="hide"><span class="material-icons">visibility_off</span><span data-i18n="hide">Скрыть</span></button>
    <button data-tp-action="pin"><span class="material-icons">push_pin</span><span data-i18n="pin">Закрепить</span></button>
    <button data-tp-action="close"><span class="material-icons">close</span><span data-i18n="close">Закрыть</span></button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

const notifSound={
  ctx:null,
  ensure(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  play(type){
    if(!state.notifSound)return;
    try{
      const ctx=this.ensure();const now=ctx.currentTime;
      const notesByType={error:[660,550,440,330],warning:[523,494,440],info:[523,659,784],success:[523,659,784,1047]};
      const notes=notesByType[type]||notesByType.info;
      notes.forEach((freq,i)=>{
        const osc=ctx.createOscillator();const g=ctx.createGain();
        osc.type='sine';osc.frequency.value=freq;
        const t0=now+i*0.06;
        g.gain.setValueAtTime(0.0001,t0);
        g.gain.linearRampToValueAtTime(0.08,t0+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
        osc.connect(g).connect(ctx.destination);osc.start(t0);osc.stop(t0+0.4);
      });
    }catch(e){}
  }
};

/* ================= NOTIFICATIONS ================= */
function showNotification(type,title,msg,options={}){
  notifSound.play(type);
  if(options.style==='toast'){
    const c=document.getElementById('toastContainer');
    const el=document.createElement('div');
    el.className='toast '+type;
    const icons={error:'error',warning:'warning',info:'info',success:'check_circle'};
    el.innerHTML=`<span class="material-icons">${icons[type]||'info'}</span>
      <div class="toast-body"><div class="toast-title">${escapeHtml(title)}</div><div>${escapeHtml(msg)}</div></div>
      <button class="toast-close"><span class="material-icons" style="font-size:16px">close</span></button>`;
    c.appendChild(el);
    const close=()=>{el.style.animation='toastOut .25s ease-in';setTimeout(()=>el.remove(),250);};
    el.querySelector('.toast-close').onclick=close;
    setTimeout(close,options.duration||4500);
    return;
  }
  const win=document.createElement('div');
  win.className='notif-modal';
  win.style.left=(options.x??(window.innerWidth/2-200))+'px';
  win.style.top=(options.y??(window.innerHeight/2-100))+'px';
  const icons={error:'error',warning:'warning',info:'info'};
  const titles={error:t('errTitle'),warning:t('warnTitle'),info:t('infoTitle')};
  win.innerHTML=`
    <div class="notif-titlebar">
      <div class="etitle"><span class="material-icons" style="font-size:16px">${icons[type]||'info'}</span>${escapeHtml(title||titles[type])}</div>
      <button class="win-btn close"><span class="material-icons" style="font-size:14px">close</span></button>
    </div>
    <div class="notif-body">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span class="material-icons notif-icon ${type}">${icons[type]||'info'}</span>
        <div class="notif-msg">${escapeHtml(msg)}</div>
      </div>
      <div class="notif-actions"><button class="btn primary notif-ok">${t('ok')}</button></div>
    </div>`;
  document.body.appendChild(win);
  win.querySelector('.notif-ok').onclick=()=>win.remove();
  win.querySelector('.win-btn.close').onclick=()=>win.remove();
  const tb=win.querySelector('.notif-titlebar');
  let d=false,sx=0,sy=0,ox=0,oy=0,pid=null;
  tb.style.touchAction='none';
  tb.addEventListener('pointerdown',e=>{if(e.target.closest('.win-btn'))return;d=true;pid=e.pointerId;sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;try{tb.setPointerCapture(pid);}catch(_){}});
  tb.addEventListener('pointermove',e=>{if(!d||e.pointerId!==pid)return;e.preventDefault();win.style.left=(ox+e.clientX-sx)+'px';win.style.top=(oy+e.clientY-sy)+'px';});
  tb.addEventListener('pointerup',()=>{d=false;pid=null;});
  tb.addEventListener('pointercancel',()=>{d=false;pid=null;});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function openDialog(opts){
  return new Promise(resolve=>{
    const back=document.createElement('div');back.className='dlg-backdrop';
    const dlg=document.createElement('div');dlg.className='dlg';
    dlg.innerHTML=`
      <div class="dlg-tb"><span class="material-icons">${opts.icon||'edit'}</span>${escapeHtml(opts.title||'')}</div>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-actions">

        <button class="btn primary" id="dlgOk">${opts.okText||t('ok')}</button>
      </div>`;
    back.appendChild(dlg);document.body.appendChild(back);
    const body=dlg.querySelector('#dlgBody');const inputs={};
    (opts.fields||[]).forEach(f=>{
      const lbl=document.createElement('label');lbl.textContent=f.label;
      let inp;
      if(f.type==='select'){
        inp=document.createElement('select');
        (f.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o.value;op.textContent=o.label;inp.appendChild(op);});
        if(f.value!=null)inp.value=f.value;
      } else if(f.type==='textarea'){
        inp=document.createElement('textarea');inp.rows=3;
        inp.style.background='var(--input-bg)';inp.style.color='var(--text)';inp.style.border='1px solid var(--border)';
        inp.style.borderRadius='4px';inp.style.padding='6px';inp.style.fontFamily='inherit';inp.style.fontSize='13px';
        if(f.value!=null)inp.value=f.value;
      } else {
        inp=document.createElement('input');inp.type=f.type||'text';
        if(f.value!=null)inp.value=f.value;if(f.placeholder)inp.placeholder=f.placeholder;
      }
      lbl.appendChild(inp);body.appendChild(lbl);inputs[f.name]=inp;
    });
    if(opts.onMount)opts.onMount(body,inputs);
    dlg.querySelector('#dlgCancel').onclick=()=>{back.remove();resolve(null);};
    dlg.querySelector('#dlgOk').onclick=()=>{
      const result={};for(const k in inputs)result[k]=inputs[k].value;
      back.remove();resolve(result);
    };
  });
}

/* ================= MIDI PARSER ================= */
class MidiParser{
  constructor(buf){this.dv=new DataView(buf);this.pos=0;this.tracks=[];this.format=0;this.division=480;this.tempoMap=[];}
  u8(){return this.dv.getUint8(this.pos++);}
  u16(){const v=this.dv.getUint16(this.pos);this.pos+=2;return v;}
  u32(){const v=this.dv.getUint32(this.pos);this.pos+=4;return v;}
  str(n){let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(this.u8());return s;}
  varlen(){let v=0,b;do{b=this.u8();v=(v<<7)|(b&0x7f);}while(b&0x80);return v;}
  parse(){
    if(this.str(4)!=='MThd')throw new Error('Not MIDI');
    const hlen=this.u32();this.format=this.u16();const ntrks=this.u16();this.division=this.u16();
    this.pos+=hlen-6;
    for(let i=0;i<ntrks;i++)this.parseTrack(i);
    return {format:this.format,division:this.division,tracks:this.tracks,tempoMap:this.tempoMap.sort((a,b)=>a.tick-b.tick)};
  }
  parseTrack(index){
    if(this.str(4)!=='MTrk'){const len=this.u32();this.pos+=len;return;}
    const len=this.u32();const end=this.pos+len;
    const track={index,notes:[],name:'',channel:0,program:0};
    let tick=0,running=0;
    while(this.pos<end){
      tick+=this.varlen();
      let status=this.dv.getUint8(this.pos);
      if(status<0x80)status=running;
      else{this.pos++;if(status<0xF0)running=status;}
      const type=status&0xF0,ch=status&0x0F;
      if(type===0x90||type===0x80){
        const note=this.u8(),vel=this.u8();
        if(type===0x90&&vel>0)track.notes.push({tick,note,vel,ch,dur:0});
        else for(let j=track.notes.length-1;j>=0;j--){const n=track.notes[j];if(n.note===note&&n.ch===ch&&n.dur===0){n.dur=Math.max(tick-n.tick,1);break;}}
      }else if(type===0xA0||type===0xB0||type===0xE0){this.pos+=2;}
      else if(type===0xC0){track.program=this.u8();track.channel=ch;}
      else if(type===0xD0){this.pos+=1;}
      else if(status===0xFF){
        const mt=this.u8(),ml=this.varlen();
        if(mt===0x03){let s='';for(let i=0;i<ml;i++)s+=String.fromCharCode(this.u8());track.name=s;}
        else if(mt===0x51){const us=(this.u8()<<16)|(this.u8()<<8)|this.u8();this.tempoMap.push({tick,usPerQuarter:us});}
        else this.pos+=ml;
      }else if(status===0xF0||status===0xF7){this.pos+=this.varlen();}
      else break;
    }
    track.notes.sort((a,b)=>a.tick-b.tick);
    if(track.notes.length)this.tracks.push(track);
  }
}
function ticksToSeconds(tick,division,tempoMap){
  let sec=0,prev=0,us=500000;
  for(const tt of tempoMap){if(tt.tick>=tick)break;sec+=(tt.tick-prev)*us/division/1e6;prev=tt.tick;us=tt.usPerQuarter;}
  sec+=(tick-prev)*us/division/1e6;return sec;
}

const GM_NAMES=['Acoustic Grand','Bright Piano','Electric Grand','Honky-tonk','E.Piano 1','E.Piano 2','Harpsichord','Clavi','Celesta','Glockenspiel','Music Box','Vibraphone','Marimba','Xylophone','Tubular Bells','Dulcimer','Drawbar Organ','Percussive Organ','Rock Organ','Church Organ','Reed Organ','Accordion','Harmonica','Tango Accordion','Nylon Guitar','Steel Guitar','Jazz Guitar','Clean Guitar','Muted Guitar','Overdriven','Distortion','Harmonics','Acoustic Bass','Finger Bass','Pick Bass','Fretless Bass','Slap 1','Slap 2','Synth Bass 1','Synth Bass 2','Violin','Viola','Cello','Contrabass','Tremolo Strings','Pizzicato','Harp','Timpani','String Ens.1','String Ens.2','Synth Str.1','Synth Str.2','Choir Aahs','Voice Oohs','Synth Voice','Orchestra Hit','Trumpet','Trombone','Tuba','Muted Trumpet','French Horn','Brass Section','Synth Brass 1','Synth Brass 2','Soprano Sax','Alto Sax','Tenor Sax','Baritone Sax','Oboe','English Horn','Bassoon','Clarinet','Piccolo','Flute','Recorder','Pan Flute','Blown Bottle','Shakuhachi','Whistle','Ocarina','Lead 1','Lead 2','Lead 3','Lead 4','Lead 5','Lead 6','Lead 7','Lead 8','Pad 1','Pad 2','Pad 3','Pad 4','Pad 5','Pad 6','Pad 7','Pad 8','FX 1','FX 2','FX 3','FX 4','FX 5','FX 6','FX 7','FX 8','Sitar','Banjo','Shamisen','Koto','Kalimba','Bagpipe','Fiddle','Shanai','Tinkle Bell','Agogo','Steel Drums','Woodblock','Taiko','Melodic Tom','Synth Drum','Reverse Cymbal','Fret Noise','Breath','Seashore','Bird','Telephone','Helicopter','Applause','Gunshot'];
const PRESETS={
  piano:{wave:'triangle',attack:0.005,decay:0.35,sustain:0.15,release:0.35,gain:0.9},
  organ:{wave:'square',attack:0.02,decay:0.1,sustain:0.8,release:0.2,gain:0.5},
  strings:{wave:'sawtooth',attack:0.12,decay:0.2,sustain:0.7,release:0.5,gain:0.45},
  bass:{wave:'sine',attack:0.005,decay:0.2,sustain:0.4,release:0.25,gain:1.0},
  pluck:{wave:'sawtooth',attack:0.001,decay:0.08,sustain:0.0,release:0.15,gain:0.8}
};
function presetFromGM(p){
  if(p<8)return 'piano';if(p<16)return 'pluck';if(p<24)return 'organ';if(p<32)return 'pluck';
  if(p<40)return 'bass';if(p<56)return 'strings';if(p<64)return 'organ';if(p<72)return 'strings';
  if(p<80)return 'organ';if(p<96)return 'strings';if(p<104)return 'pluck';return 'piano';
}

const player={
  ctx:null,master:null,analyser:null,dryGain:null,wetGain:null,convolver:null,
  playing:false,paused:false,startTime:0,pauseAt:0,
  nodes:[],schedule:[],duration:0,
  volume:0.7,outputMode:'webaudio',outputDevice:'',
  midiOut:null,midiTimers:[],
  trackSettings:{},trackGains:{},
  globalWave:'triangle',globalPreset:'piano',

  async ensureCtx(){
    if(!this.ctx){
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.volume;
      this.analyser=this.ctx.createAnalyser();
      this.analyser.fftSize=256;this.analyser.smoothingTimeConstant=0.75;
      this.master.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      this.convolver=this.ctx.createConvolver();
      this.convolver.buffer=this.makeImpulse(1.8,2.2);
      this.dryGain=this.ctx.createGain();this.dryGain.gain.value=1;
      this.wetGain=this.ctx.createGain();this.wetGain.gain.value=0;
      this.dryGain.connect(this.master);
      this.convolver.connect(this.wetGain).connect(this.master);
    }
    if(this.ctx.state==='suspended'){try{await this.ctx.resume();}catch(e){console.warn('resume',e);}}
    if(this.outputDevice && this.master.setSinkId){try{await this.master.setSinkId(this.outputDevice);}catch(e){}}
    return this.ctx;
  },
  async listOutputDevices(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return [];
    try{
      await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>{});
      const devices=await navigator.mediaDevices.enumerateDevices();
      return devices.filter(d=>d.kind==='audiooutput');
    }catch(e){return [];}
  },
  makeImpulse(duration,decay){
    const rate=this.ctx.sampleRate;const len=Math.max(1,Math.floor(rate*duration));
    const buf=this.ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
    return buf;
  },
  midiFreq(n){return 440*Math.pow(2,(n-69)/12);},
  setVolume(v){this.volume=v;if(this.master)this.master.gain.setTargetAtTime(v,this.ctx.currentTime,0.02);},
  setTrackVolume(idx,v){if(this.trackGains[idx])this.trackGains[idx].gain.setTargetAtTime(v,this.ctx.currentTime,0.02);},
  setReverb(a){if(this.wetGain)this.wetGain.gain.setTargetAtTime(a,this.ctx.currentTime,0.05);},

  buildSchedule(parsed){
    const {tracks,division,tempoMap}=parsed;
    const events=[];let maxEnd=0;
    const anySolo=Object.values(this.trackSettings).some(s=>s.solo);
    tracks.forEach(track=>{
      const s=this.trackSettings[track.index]||{};
      if(track.channel===9)return;
      if(s.mute)return;
      if(anySolo&&!s.solo)return;
      const presetName=s.preset||presetFromGM(track.program);
      const preset=PRESETS[presetName]||PRESETS.piano;
      const wave=s.wave||this.globalWave||preset.wave;
      const trGain=s.gain!=null?s.gain:1;
      track.notes.forEach(n=>{
        const t0=ticksToSeconds(n.tick,division,tempoMap);
        const t1=ticksToSeconds(n.tick+n.dur,division,tempoMap);
        events.push({time:t0,end:t1,note:n.note,ch:n.ch,program:track.program|0,vel:n.vel/127,wave,preset,gain:trGain,track:track.index});
        if(t1>maxEnd)maxEnd=t1;
      });
    });
    events.sort((a,b)=>a.time-b.time);
    this.schedule=events;this.duration=maxEnd;
  },

  async play(offset=0){
    if(this.outputMode==='webmidi')return this.playMidi(offset);
    const ctx=await this.ensureCtx();
    if(!this.schedule.length){console.warn('[QMidApp] пустой schedule');return;}
    this.stopNodes();
    this.playing=true;this.paused=false;
    const now=ctx.currentTime+0.15;
    this.startTime=now-offset;
    this.trackGains={};
    const trackIds=new Set(this.schedule.map(ev=>ev.track));
    for(const trId of trackIds){
      const tg=ctx.createGain();
      const s=this.trackSettings[trId]||{};
      tg.gain.value=s.gain!=null?s.gain:1;
      tg.connect(this.dryGain);tg.connect(this.convolver);
      this.trackGains[trId]=tg;
    }
    const avgRev=trackIds.size?[...trackIds].reduce((a,id)=>a+(this.trackSettings[id]?.reverb||0),0)/trackIds.size:0;
    this.setReverb(avgRev);
    for(const ev of this.schedule){
      if(ev.end<offset)continue;
      try{this.scheduleNote(ev,now,offset);}catch(err){console.error('[QMidApp] scheduleNote error:',err);}
    }
    console.log('[QMidApp] play:',this.schedule.length,'events, nodes:',this.nodes.length);
  },

  scheduleNote(ev,now,offset){
    const startRel=Math.max(ev.time-offset,0);
    const start=now+startRel;
    const stopAt=now+Math.max(ev.end-offset,startRel+0.02);
    const p=ev.preset;
    const osc=this.ctx.createOscillator();
    const gain=this.ctx.createGain();
    osc.type=ev.wave;osc.frequency.value=this.midiFreq(ev.note);
    const peak=Math.max(0.0001,ev.vel*p.gain*0.5);
    const sustain=peak*p.sustain;
    const aEnd=start+p.attack;
    const dEnd=aEnd+p.decay;
    const relStart=Math.max(stopAt,dEnd+0.01);
    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.linearRampToValueAtTime(peak,aEnd);
    gain.gain.linearRampToValueAtTime(sustain,dEnd);
    gain.gain.setValueAtTime(sustain,relStart);
    gain.gain.linearRampToValueAtTime(0.0001,relStart+p.release);
    const dest=this.trackGains[ev.track]||this.master;
    osc.connect(gain).connect(dest);
    osc.start(start);osc.stop(relStart+p.release+0.06);
    this.nodes.push({osc,gain,end:relStart+p.release+0.06});
    if(this.nodes.length>4000)this.cleanNodes();
  },

  async rebuildPreset(){
    if(!this.playing&&!this.paused)return;
    const at=this.currentTime();
    this.stop();
    if(parsed){this.buildSchedule(parsed);await this.play(at);}
  },

  playMidi(offset=0){
    if(!this.midiOut){showNotification('error',t('errTitle'),t('midiPickPort'));return;}
    this.stopMidiTimers();
    this.playing=true;this.paused=false;
    const now=performance.now();
    this.startTime=now/1000-offset;
    // Отправляем настройки для каждого канала
    for(const trId in this.trackSettings){
      const s=this.trackSettings[trId];const ch=s._ch;
      if(ch==null||ch===9)continue;
      if(s.mute){try{this.midiOut.send([0xB0|ch,7,0]);}catch(e){}continue;}
      const g=Math.max(0,Math.min(127,Math.round((s.gain!=null?s.gain:1)*127)));
      const r=Math.max(0,Math.min(127,Math.round((s.reverb||0)*127)));
      try{
        this.midiOut.send([0xB0|ch,7,g]);
        this.midiOut.send([0xB0|ch,91,r]);
        const prog=s.presetIndex!=null?s.presetIndex:0;
        this.midiOut.send([0xC0|ch,prog&0x7f]);
      }catch(e){console.warn('[MIDI] setup err',e);}
    }
    for(const ev of this.schedule){
      if(ev.end<offset)continue;
      const onDelay=Math.max(0,(ev.time-offset)*1000);
      const offDelay=Math.max(0,(ev.end-offset)*1000);
      const ch=ev.ch&0xF;const vel=Math.max(1,Math.round(ev.vel*127));
      this.midiTimers.push(setTimeout(()=>{try{this.midiOut.send([0x90|ch,ev.note&0x7f,vel]);}catch(e){}},onDelay));
      this.midiTimers.push(setTimeout(()=>{try{this.midiOut.send([0x80|ch,ev.note&0x7f,0]);}catch(e){}},offDelay));
    }
  },

  stopMidiTimers(){for(const id of this.midiTimers)clearTimeout(id);this.midiTimers=[];if(this.midiOut)for(let ch=0;ch<16;ch++){try{this.midiOut.send([0xB0|ch,123,0]);this.midiOut.send([0xB0|ch,120,0]);}catch(e){}}},
  cleanNodes(){const tt=this.ctx.currentTime;this.nodes=this.nodes.filter(n=>n.end>tt);},
  stopNodes(){for(const n of this.nodes){try{n.osc.stop();}catch(e){}try{n.osc.disconnect();n.gain.disconnect();}catch(e){}}this.nodes=[];for(const k in this.trackGains){try{this.trackGains[k].disconnect();}catch(e){}}this.trackGains={};},
  stop(){this.playing=false;this.paused=false;this.pauseAt=0;this.stopNodes();this.stopMidiTimers();},
  pause(){if(!this.playing)return;this.pauseAt=this.outputMode==='webmidi'?(performance.now()/1000-this.startTime):(this.ctx.currentTime-this.startTime);this.playing=false;this.paused=true;this.stopNodes();this.stopMidiTimers();},
  resume(){if(!this.paused)return;const at=this.pauseAt;this.paused=false;this.play(at);},
  seek(to){if(!this.schedule.length)return;const was=this.playing;this.stop();if(was)this.play(to);else{this.paused=true;this.pauseAt=to;}},
  currentTime(){if(this.paused)return this.pauseAt;if(!this.playing)return 0;const tt=this.outputMode==='webmidi'?(performance.now()/1000-this.startTime):(this.ctx.currentTime-this.startTime);return Math.min(tt,this.duration);}
};

/* ================= WEB MIDI ================= */
let midiAccess=null;
async function initMIDI(){
  if(midiAccess)return midiAccess;
  if(!navigator.requestMIDIAccess){showNotification('error',t('errTitle'),t('midiNotSupported'));return null;}
  try{
    midiAccess=await navigator.requestMIDIAccess({sysex:false});
    midiAccess.onstatechange=e=>{
      console.log('[MIDI] state:',e.port?.name,e.port?.state);
      refreshMidiPorts();
    };
    return midiAccess;
  }catch(e){
    showNotification('error',t('errTitle'),'MIDI access denied: '+e.message);
    return null;
  }
}
function refreshMidiPorts(){
  const sel=document.getElementById('midiPortSel');if(!sel)return;
  const prev=sel.value;sel.innerHTML='';
  const outs=midiAccess?[...midiAccess.outputs.values()]:[];
  if(!outs.length){const o=document.createElement('option');o.value='';o.textContent=t('noMidi');sel.appendChild(o);player.midiOut=null;return;}
  for(const out of outs){
    const o=document.createElement('option');
    o.value=out.id;
    o.textContent=out.name+(out.state==='connected'?'':' (offline)');
    sel.appendChild(o);
  }
  const pick=outs.find(o=>o.id===prev)||outs.find(o=>o.state==='connected')||outs[0];
  sel.value=pick.id;
  player.midiOut=pick;
  console.log('[MIDI] selected:',pick.name);
}

function buildFileTab(content){
  const sec=document.createElement('div');sec.className='section';
  sec.innerHTML=`
    <div class="section-title"><span class="material-icons">folder</span>${t('tabFile')}</div>
    <div class="row">
      <button class="btn primary" id="btnOpenMid"><span class="material-icons">upload_file</span>${t('openMid')}</button>
      <button class="btn" id="btnSaveMid"><span class="material-icons">save</span>${t('saveMid')}</button>
      <button class="btn" id="btnSaveJs"><span class="material-icons">code</span>${t('saveJs')}</button>
    </div>
    <input type="file" id="file" accept=".mid,.midi,audio/midi" style="display:none">
    <div class="status" id="fileStatus" style="margin-top:10px">${parsed?`${t('loaded')}: ${parsed.tracks.length} ${t('tracks').toLowerCase()}`:t('fileNotLoaded')}</div>`;
  content.appendChild(sec);

  sec.querySelector('#btnOpenMid').onclick=()=>sec.querySelector('#file').click();
  sec.querySelector('#file').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const buf=await f.arrayBuffer();
      parsed=new MidiParser(buf).parse();
      $('meta').textContent=`${f.name} • fmt${parsed.format} • ${parsed.tracks.length}`;
      const totalTicks=Math.max(...parsed.tracks.flatMap(tt=>tt.notes.map(n=>n.tick+n.dur)),0);
      const dur=ticksToSeconds(totalTicks,parsed.division,parsed.tempoMap);
      $('status').textContent=`${t('loaded')}. ${t('duration')} ≈ ${dur.toFixed(1)} ${t('sec')}.`;
      player.trackSettings={};
      for(const tr of parsed.tracks){
        const saved=state.trackSettings[tr.index]||{};
        player.trackSettings[tr.index]={
          _ch:tr.channel,
          gain:saved.gain!=null?saved.gain:1,
          reverb:saved.reverb!=null?saved.reverb:0,
          mute:saved.mute||false,solo:saved.solo||false,
          preset:saved.preset||presetFromGM(tr.program),
          wave:saved.wave||null,
          presetIndex:saved.presetIndex!=null?saved.presetIndex:tr.program
        };
      }
      ['play','stop'].forEach(id=>$(id).disabled=false);
      $('pause').disabled=true;
      showNotification('success','QMidApp',`${t('loaded')}: ${parsed.tracks.length}`,{style:'toast'});
      renderTab();
    }catch(err){
      showNotification('error',t('errTitle'),t('errorReadMidi')+': '+err.message);
    }
  };

  sec.querySelector('#btnSaveMid').onclick=()=>{
    if(!parsed){showNotification('error',t('errTitle'),t('loadFirst'));return;}
    player.buildSchedule(parsed);
    const data=exportMidiBin(player.schedule,parsed.division||480,player.trackSettings);
    downloadBlob(new Blob([data],{type:'audio/midi'}),'qmidapp-export.mid','audio/midi');
    showNotification('success',t('ok'),t('exportMidDone'),{style:'toast'});
  };
  sec.querySelector('#btnSaveJs').onclick=()=>{
    if(!parsed){showNotification('error',t('errTitle'),t('loadFirst'));return;}
    player.buildSchedule(parsed);
    const js=generateJsModule(player.schedule,parsed);
    downloadBlob(js,'qmidapp-melody.js','application/javascript');
    showNotification('success',t('ok'),t('exportJsDone'),{style:'toast'});
  };
}

          </label>
          <label>${t('reverb')} <b>${Math.round(s.reverb*100)}%</b>

          </label>
        </div>
      </div>`;

    if(s.mute)el.querySelector('[data-role="mute"]').classList.add('active');

          saveTrackSettings();

      } else if(role==='gain'){

          const v=+inp.value/100;

          if(parsed){player.buildSchedule(parsed);player.rebuildPreset();}
        });
      } else {
        inp.addEventListener('change',()=>{
          if(inp.value)player.trackSettings[idx][role]=inp.value;
          else delete player.trackSettings[idx][role];
          saveTrackSettings();
          if(parsed){player.buildSchedule(parsed);player.rebuildPreset();}
        });
      }
    });
  });
  drawAllPianorolls();
}
function saveTrackSettings(){
  const clean={};
  for(const k in player.trackSettings){const {_ch,...rest}=player.trackSettings[k];clean[k]=rest;}
  state.trackSettings=clean;saveState();
}
function drawPianoroll(canvas,track){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4f8cff';
  const isLight=document.documentElement.dataset.theme==='light'||document.documentElement.dataset.style==='mac';
  ctx.strokeStyle=isLight?'#d0d4dc':'#1f242e';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=12){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  if(!track.notes.length)return;
  const lo=Math.min(...track.notes.map(n=>n.note));
  const hi=Math.max(...track.notes.map(n=>n.note));
  const span=Math.max(1,hi-lo);
  const totalTicks=Math.max(...track.notes.map(n=>n.tick+n.dur),1);
  track.notes.forEach(n=>{
    const x=(n.tick/totalTicks)*W;
    const w=Math.max(2,(n.dur/totalTicks)*W);
    const y=H-((n.note-lo)/span)*(H-6)-5;
    const grad=ctx.createLinearGradient(0,y,0,y+4);
    grad.addColorStop(0,accent);grad.addColorStop(1,shade(accent,-25));
    ctx.fillStyle=grad;ctx.fillRect(x,y,w,4);
  });
}
function drawAllPianorolls(){
  document.querySelectorAll('canvas[data-pianoroll]').forEach(c=>{
    const idx=+c.dataset.pianoroll;
    const track=parsed.tracks.find(t=>t.index===idx);
    if(track)drawPianoroll(c,track);
  });
}
function drawPlayhead(){
  if(!parsed||!player.schedule.length){requestAnimationFrame(drawPlayhead);return;}
  const ratio=player.duration?player.currentTime()/player.duration:0;
  document.querySelectorAll('canvas[data-pianoroll]').forEach(c=>{
    const ctx=c.getContext('2d');
    const W=c.width,H=c.height;
    if(player.playing||player.paused){
      const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4f8cff';
      ctx.fillStyle=accent;ctx.fillRect(W*ratio-1,0,2,H);
    }
  });
  requestAnimationFrame(drawPlayhead);
}

  const grid=sec.querySelector('#seqGrid');
  const notes=[60,64,67,72];
  const noteLabels=['C4','E4','G4','C5'];
  for(let row=0;row<4;row++){
    const lbl=document.createElement('div');lbl.className='seq-label';lbl.textContent=noteLabels[row];
    grid.appendChild(lbl);
    for(let col=0;col<8;col++){
      const idx=row*8+col;
      const cell=document.createElement('div');
      cell.className='seq-cell'+(state.seq.steps[idx]?' on':'')+(col%4===0?' beat':'');
      cell.dataset.idx=idx;
      cell.onclick=()=>{
        state.seq.steps[idx]=!state.seq.steps[idx];
        cell.classList.toggle('on',state.seq.steps[idx]);
        saveState();
      };
      grid.appendChild(cell);
    }
  }

  const startSeq=async()=>{
    stopSeq();
    seqCtx=await player.ensureCtx();
    const bpm=+sec.querySelector('#seqTempo').value||120;
    const interval=(60/bpm/2)*1000;
    const wave=sec.querySelector('#seqWaveSel').value;
    seqStep=0;
    seqNextTime=performance.now();
    const tick=()=>{
      const now=performance.now();
      const col=seqStep%8;
      document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('playhead'));
      for(let row=0;row<4;row++){
        const idx=row*8+col;
        const cell=grid.querySelector(`.seq-cell[data-idx="${idx}"]`);
        if(cell)cell.classList.add('playhead');
        if(state.seq.steps[idx]){
          const freq=440*Math.pow(2,(notes[row]-69)/12);
          const osc=seqCtx.createOscillator(),g=seqCtx.createGain();
          osc.type=wave;osc.frequency.value=freq;
          const t0=seqCtx.currentTime;
          g.gain.setValueAtTime(0.0001,t0);
          g.gain.linearRampToValueAtTime(0.25,t0+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001,t0+0.25);
          osc.connect(g).connect(player.master||seqCtx.destination);
          osc.start(t0);osc.stop(t0+0.3);
        }
      }
      seqStep++;
      seqNextTime+=interval;
      const drift=seqNextTime-now;
      seqTimer=setTimeout(tick,Math.max(0,drift));
    };
    tick();
  };
  const stopSeq=()=>{
    if(seqTimer){clearTimeout(seqTimer);seqTimer=null;}
    document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('playhead'));
    seqStep=0;
  };
  sec.querySelector('#seqPlay').onclick=startSeq;
  sec.querySelector('#seqStop').onclick=stopSeq;
  sec.querySelector('#seqTempo').onchange=e=>{state.seq.tempo=+e.target.value;saveState();};
  sec.querySelector('#seqWaveSel').onchange=e=>{state.seq.wave=e.target.value;saveState();};
  sec.querySelector('#seqClear').onclick=()=>{
    state.seq.steps=Array(32).fill(false);saveState();
    document.querySelectorAll('.seq-cell').forEach(c=>c.classList.remove('on'));
  };
}

        {value:'warning',label:t('warnTitle')},
        {value:'error',label:t('errTitle')},

/* SHORTCUTS */
function renderShortcuts(){
  const d=$('desktop');d.innerHTML='';
  state.shortcuts.forEach((sc,i)=>{
    const el=document.createElement('div');
    el.className='shortcut';
    el.style.left=sc.x+'px';el.style.top=sc.y+'px';
    el.innerHTML=`<div class="sc-icon"><span class="material-icons">${sc.icon||'apps'}</span></div><div class="sc-label">${escapeHtml(sc.name)}</div>`;
    el.onclick=()=>runShortcut(sc);
    el.oncontextmenu=e=>{e.preventDefault();openShortcutDialog(sc,i);};
    d.appendChild(el);
  });
}
function runShortcut(sc){
  winEl.classList.remove('minimized');updateTaskbar();
  const a=sc.action;
  if(a==='file'||a==='editor'||a==='daw'||a==='settings'||a==='about'){
    activeTab=a;
    document.querySelectorAll('.topbar .tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===a));
    renderTab();
  } else if(a==='export-mid'){
    if(!parsed){showNotification('warning',t('warnTitle'),t('loadFirst'));return;}
    player.buildSchedule(parsed);
    downloadBlob(new Blob([exportMidiBin(player.schedule,parsed.division||480,player.trackSettings)],{type:'audio/midi'}),'export.mid','audio/midi');
  } else if(a==='export-js'){
    if(!parsed){showNotification('warning',t('warnTitle'),t('loadFirst'));return;}
    player.buildSchedule(parsed);
    downloadBlob(generateJsModule(player.schedule,parsed),'melody.js','application/javascript');
  } else if(a==='toggle-theme'){
    applyTheme(state.theme==='dark'?'light':'dark');
  } else if(a==='show-error'){
    showNotification('error',t('errTitle'),sc.text||t('testErr'));
  } else if(a==='show-warning'){
    showNotification('warning',t('warnTitle'),sc.text||t('testWarn'));
  } else if(a==='show-info'){
    showNotification('info',t('infoTitle'),sc.text||t('testInfo'));
  } else if(a==='show-toast'){
    showNotification(sc.type||'info',t('infoTitle'),sc.text||t('testToast'),{style:'toast'});
  }
}

/* VISUALIZER */
function drawVisualizer(){
  const c=$('visCanvas');if(!c){requestAnimationFrame(drawVisualizer);return;}
  const ctx=c.getContext('2d');const W=c.width,H=c.height;
  ctx.clearRect(0,0,W,H);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4f8cff';
  if(player.analyser&&state.showVisualizer){
    if(state.vizType==='wave'){
      const data=new Uint8Array(player.analyser.fftSize);
      player.analyser.getByteTimeDomainData(data);
      ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<data.length;i++){const x=(i/data.length)*W;const y=(data[i]/255)*H;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.stroke();
    } else {
      const data=new Uint8Array(player.analyser.frequencyBinCount);
      player.analyser.getByteFrequencyData(data);
      ctx.fillStyle=accent;const bars=64,step=Math.floor(data.length/bars),bw=W/bars;
      for(let i=0;i<bars;i++){let v=0;for(let j=0;j<step;j++)v=Math.max(v,data[i*step+j]);const h=(v/255)*H;ctx.fillRect(i*bw,H-h,bw-1,h);}
    }
  }
  requestAnimationFrame(drawVisualizer);
}

/* TASKBAR */
function updateTaskbar(){
  const box=$('taskbarIcons');box.innerHTML='';
  const isMin=winEl.classList.contains('minimized');
  const el=document.createElement('div');
  el.className='task-icon'+(isMin?'':' active')+(state.pinnedTask?' pinned':'');
  el.innerHTML=`<span class="material-icons">piano</span><span>QMidApp</span>`;
  let lpTimer=null,lpTrig=false;
  el.addEventListener('pointerdown',()=>{lpTrig=false;lpTimer=setTimeout(()=>{lpTrig=true;
    const pr=$('taskPreview');const r=el.getBoundingClientRect();
    pr.style.left=Math.min(window.innerWidth-260,r.left)+'px';
    pr.style.top=(r.top-130)+'px';
    pr.classList.add('show');
  },500);});
  el.addEventListener('pointerup',()=>{
    clearTimeout(lpTimer);
    if(lpTrig)return;
    if(winEl.classList.contains('minimized'))winEl.classList.remove('minimized');
    else winEl.classList.add('minimized');
    updateTaskbar();
  });
  el.addEventListener('pointerleave',()=>clearTimeout(lpTimer));
  box.appendChild(el);
}
document.querySelectorAll('[data-tp-action]').forEach(btn=>{
  btn.onclick=()=>{
    const a=btn.dataset.tpAction;
    if(a==='open')winEl.classList.remove('minimized');
    else if(a==='hide')winEl.classList.add('minimized');
    else if(a==='pin'){state.pinnedTask=!state.pinnedTask;saveState();}
    else if(a==='close')winEl.classList.add('minimized');
    $('taskPreview').classList.remove('show');
    updateTaskbar();
  };
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#taskPreview')&&!e.target.closest('.task-icon'))$('taskPreview').classList.remove('show');},{capture:true});

$('startBtn').onclick=e=>{e.stopPropagation();$('startMenu').classList.toggle('show');};
document.querySelectorAll('[data-open-tab]').forEach(b=>{
  b.onclick=()=>{
    const tab=b.dataset.openTab;
    activeTab=tab;
    document.querySelectorAll('.topbar .tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
    renderTab();winEl.classList.remove('minimized');
    $('startMenu').classList.remove('show');updateTaskbar();
  };
});
$('smRestoreWin').onclick=()=>{winEl.classList.remove('minimized');$('startMenu').classList.remove('show');updateTaskbar();};
$('smQuit').onclick=()=>{$('startMenu').classList.remove('show');
  if(confirm(t('confirmQuit'))){window.open('','_self').close();setTimeout(()=>{winEl.classList.add('minimized');updateTaskbar();},50);}
};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu')&&!e.target.closest('#startBtn'))$('startMenu').classList.remove('show');});

/* TRANSPORT */
$('masterVol').addEventListener('input',e=>{const v=+e.target.value/100;state.masterVol=v;player.setVolume(v);saveState();});
$('play').addEventListener('click',async()=>{
  if(!parsed)return;
  if(player.paused)player.resume();
  else{
    player.outputMode=state.outputMode;
    player.globalWave=state.globalWave;
    player.globalPreset=state.globalPreset;
    player.buildSchedule(parsed);
    await player.play(0);
  }
  $('pause').disabled=false;
  animateProgress();
});
$('pause').addEventListener('click',()=>{player.pause();$('pause').disabled=true;});
$('stop').addEventListener('click',()=>{player.stop();$('bar').style.width='0%';$('pause').disabled=true;});
$('progress').addEventListener('click',e=>{
  if(!player.duration)return;
  const r=$('progress').getBoundingClientRect();
  const rel=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  player.seek(rel*player.duration);
  $('bar').style.width=(rel*100)+'%';
  if(player.playing){$('pause').disabled=false;animateProgress();}
});
function animateProgress(){
  if(!player.playing&&!player.paused)return;
  const tt=player.currentTime(),d=player.duration||1;
  $('bar').style.width=Math.min(100,(tt/d)*100)+'%';
  if(tt>=d){player.stop();$('bar').style.width='0%';return;}
  requestAnimationFrame(animateProgress);
}

/* EXPORT */
function downloadBlob(data,filename,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
}
function writeVarLen(n){const b=[];b.unshift(n&0x7f);while((n>>=7))b.unshift((n&0x7f)|0x80);return b;}
function exportMidiBin(schedule,division,trackSettings){
  const bytes=[];const str=s=>[...s].map(c=>c.charCodeAt(0));
  const u32=n=>[n>>24&255,n>>16&255,n>>8&255,n&255];const u16=n=>[n>>8&255,n&255];
  bytes.push(...str('MThd'),...u32(6),...u16(0),...u16(1),...u16(division));
  const usPerQuarter=500000,tps=division*1e6/usPerQuarter;
  const events=[];const seen=new Set();
  for(const ev of schedule){
    const ch=ev.ch&0xF,ts=trackSettings[ev.track]||{};
    let prog=ev.program;if(ts.presetIndex!=null)prog=ts.presetIndex;
    if(!seen.has(ch)){
      seen.add(ch);
      events.push({t:0,bytes:[0xC0|ch,prog&0x7f]});
      const vol=Math.max(0,Math.min(127,Math.round((ts.gain!=null?ts.gain:1)*127)));
      events.push({t:0,bytes:[0xB0|ch,7,vol]});
      const rev=Math.max(0,Math.min(127,Math.round((ts.reverb||0)*127)));
      events.push({t:0,bytes:[0xB0|ch,91,rev]});
    }
    const v=Math.max(1,Math.min(127,Math.round(ev.vel*127*(ts.gain!=null?ts.gain:1))));
    events.push({t:Math.round(ev.time*tps),bytes:[0x90|ch,ev.note&0x7f,v]});
    events.push({t:Math.round(ev.end*tps),bytes:[0x80|ch,ev.note&0x7f,0]});
  }
  events.sort((a,b)=>a.t-b.t);
  const track=[];track.push(0,0xFF,0x51,0x03,usPerQuarter>>16&255,usPerQuarter>>8&255,usPerQuarter&255);
  let last=0;
  for(const e of events){track.push(...writeVarLen(e.t-last));track.push(...e.bytes);last=e.t;}
  track.push(0,0xFF,0x2F,0x00);
  bytes.push(...str('MTrk'),...u32(track.length),...track);
  return new Uint8Array(bytes);
}
function generateJsModule(schedule,parsed){
  const events=schedule.map(ev=>({t:+ev.time.toFixed(4),d:+Math.max(0.02,ev.end-ev.time).toFixed(4),n:ev.note,v:Math.round(ev.vel*127),ch:ev.ch,p:ev.program}));
  const payload=JSON.stringify({meta:{division:parsed.division,format:parsed.format,tracks:parsed.tracks.length},events},null,2);
  return `/* QMidApp v26-nov-2.8 — Quantum ACD × DeepSeek */
const QMidApp=(()=>{const DATA=${payload};
const midiToFreq=n=>440*Math.pow(2,(n-69)/12);
function play(ctx,offset=0){if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime+0.1;let maxEnd=0;
for(const ev of DATA.events){if(ev.t+ev.d<offset)continue;const startRel=Math.max(ev.t-offset,0);const stopRel=Math.max(ev.t+ev.d-offset,startRel+0.05);
const start=now+startRel,stop=now+stopRel;
const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='triangle';osc.frequency.value=midiToFreq(ev.n);
const peak=Math.max(0.001,ev.v/127*0.5);g.gain.setValueAtTime(0.0001,start);g.gain.linearRampToValueAtTime(peak,start+0.005);g.gain.linearRampToValueAtTime(peak*0.4,start+0.2);g.gain.setValueAtTime(peak*0.4,stop);g.gain.linearRampToValueAtTime(0.0001,stop+0.25);
osc.connect(g).connect(ctx.destination);osc.start(start);osc.stop(stop+0.3);if(stop>maxEnd)maxEnd=stop;}return maxEnd-now;}
function playMidi(outPort,offset=0){if(!outPort)throw new Error('No MIDI');const t0=performance.now();
for(const ev of DATA.events){if(ev.t+ev.d<offset)continue;const tOn=t0+Math.max(0,(ev.t-offset)*1000),tOff=t0+Math.max(0,(ev.t+ev.d-offset)*1000);
setTimeout(()=>outPort.send([0x90|(ev.ch&0xF),ev.n&0x7f,ev.v&0x7f]),tOn-t0);setTimeout(()=>outPort.send([0x80|(ev.ch&0xF),ev.n&0x7f,0]),tOff-t0);}}
return{DATA,play,playMidi};})();`;
}

/* CLOCK */
function updateClock(){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  $('clockTime').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
  $('clockDate').textContent=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
}
setInterval(updateClock,1000);updateClock();

applyTheme(state.theme);

else if(state.wallpaper==='customVideo'&&state.wallpaperVideo)applyWallpaper('customVideo',null,state.wallpaperVideo);
